# ==========================================================
#  Curso "Git no VS Code": o robô que confere cada passo
# ==========================================================
#  Toda a lógica está em .github/scripts/curso.sh
#  Os textos de cada passo estão em .github/passos/
name: Curso

on:
  push:                     # a cada envio (Sync Changes / git push) na main
    branches: [main]
  issue_comment:            # quando o aluno comenta na issue (ex.: "conferir")
    types: [created]
  workflow_dispatch:        # botão "Run workflow" na aba Actions, para rodar à mão

permissions:
  contents: write            # o robô põe o certificado no README no fim do curso
  issues: write             # criar a issue, comentar e trocar etiquetas

# um de cada vez, para dois eventos seguidos não responderem em dobro
concurrency:
  group: curso
  cancel-in-progress: false

jobs:
  conferir:
    # não roda no repositório-modelo, só nas cópias dos alunos
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0    # histórico completo: o robô olha os commits antigos
      - name: Conferir o passo atual
        run: bash .github/scripts/curso.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENTO: ${{ github.event_name }}
